name: Skills Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-spec:
    name: Validate Spec (skills-ref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install skills-ref
        run: pip install --quiet skills-ref

      - name: Validate all skills
        run: |
          python - <<'PY'
          from pathlib import Path
          from skills_ref.validator import validate

          failures = 0
          for skill in sorted(Path("skills").glob("*/")):
              errors = validate(skill)
              if not errors:
                  print(f"OK   {skill.name}")
                  continue

              failures += 1
              print(f"FAIL {skill.name}:")
              for error in errors:
                  print(f"  - {error}")

          if failures:
              raise SystemExit(f"{failures} skill(s) failed spec validation")
          PY

  validate-quality:
    name: Validate Quality (skill-validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install skill-validator
        run: go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@latest

      - name: Validate skills
        env:
          PATH: ${{ env.PATH }}:$(go env GOPATH)/bin
        run: |
          skill-validator check --emit-annotations -o markdown skills/ >> "$GITHUB_STEP_SUMMARY" || true

  validate-spec-action:
    name: Validate Spec (validate-skill)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - building-mcp-servers
          - code-review-and-quality
          - composio-mcp
          - create-agent-harness
          - create-readme
          - drawio-architecture
          - gap-analysis
          - migration-planner
          - notebooklm-mcp
          - observability-and-instrumentation
          - obsidian
          - quality-test-implementation
          - sonarqube-autofix
          - web-design-guidelines
          - wordpress-mcp
    steps:
      - uses: actions/checkout@v5

      - name: Validate ${{ matrix.skill }}
        uses: Flash-Brew-Digital/validate-skill@v1
        with:
          path: ./skills/${{ matrix.skill }}
          validate-references: false
          fail-on-warning: false
          ignore-rules: body-length,body-progressive-disclosure

  validate-quality-skillcheck:
    name: Validate Quality (skillcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install skillcheck
        run: pip install --quiet skillcheck

      - name: Run skillcheck
        run: |
          # --skip-ref-check: avoids false positives for npm/package names in markdown
          # --ignore frontmatter.field.ecosystem: license/metadata are ecosystem-common, not spec errors
          # --ignore disclosure.metadata-budget: advisory only, frontmatter is intentionally detailed
          # --format github: emits ::notice/::warning annotations visible in PR files tab
          skillcheck skills/ \
            --skip-ref-check \
            --ignore frontmatter.field.ecosystem \
            --ignore disclosure.metadata-budget \
            --format github \
            >> "$GITHUB_STEP_SUMMARY" || true

          # Re-run in quiet mode for exit code (only hard errors fail)
          skillcheck skills/ \
            --skip-ref-check \
            --ignore frontmatter.field.ecosystem \
            --ignore disclosure.metadata-budget \
            --ignore frontmatter.field.unknown \
            --ignore frontmatter.description.person-voice \
            --ignore disclosure.body-budget \
            --ignore sizing.body.line-count \
            --ignore description.quality-score \
            -q

  security-scan:
    name: Security Scan (Snyk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      - name: Run Snyk test
        run: snyk test --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Snyk Code test
        run: snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

  security-scan-skills:
    name: Security Scan (Cisco Skill Scanner)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install skill-scanner
        run: pip install --quiet "cisco-ai-skill-scanner[google]==2.2.1"

      - name: Run scan
        id: scan
        env:
          SKILL_SCANNER_LLM_API_KEY: ${{ secrets.SKILL_SCANNER_LLM_API_KEY }}
          SKILL_SCANNER_LLM_MODEL: ${{ vars.SKILL_SCANNER_LLM_MODEL }}
          SKILL_SCANNER_LLM_PROVIDER: ${{ vars.SKILL_SCANNER_LLM_PROVIDER }}
          SKILL_SCANNER_LLM_BASE_URL: ${{ vars.SKILL_SCANNER_LLM_BASE_URL }}
          # The omniroute gateway translates strict json_schema into a forced
          # tool call (empty message.content), so the scanner must ask for a
          # plain JSON object instead.
          SKILL_SCANNER_LLM_FORCE_JSON_OBJECT: "1"
          # Antigravity-routed Gemini rejects reasoning_effort=none ("only works
          # in thinking mode"); low keeps the reasoning budget small.
          SKILL_SCANNER_LLM_REASONING_EFFORT: "low"
          SKILL_SCANNER_LLM_MAX_TOKENS: "16384"
        run: |
          # Report-only: findings and scanner errors land in the step summary
          # (and the SARIF upload below feeds Code Scanning) — the job never
          # goes red on scan results.
          set +e
          skill-scanner scan-all skills \
            --format sarif --policy .github/skill-scanner-policy.yaml \
            --recursive --check-overlap \
            --use-llm --output results.sarif > scan.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write summary
        if: always()
        env:
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path

          print("## Cisco Skill Scanner — security scan (report-only)\n")

          ec = os.environ.get("SCAN_EXIT_CODE", "")
          if ec and ec != "0":
              print(f"> Scanner exited with code {ec}. Results are informational only — see the log at the bottom.\n")

          sarif_path = Path("results.sarif")
          results = []
          if sarif_path.exists() and sarif_path.stat().st_size > 0:
              data = json.loads(sarif_path.read_text())
              for run in data.get("runs", []):
                  results.extend(run.get("results", []))

          if not results:
              print("No findings reported.")
          else:
              order = {"error": 0, "warning": 1, "note": 2}
              results.sort(key=lambda r: order.get(r.get("level", "note"), 3))
              print(f"**{len(results)} finding(s)**\n")
              print("| Severity | Rule | Location |")
              print("|---|---|---|")
              for r in results:
                  loc = r.get("locations", [{}])[0].get("physicalLocation", {})
                  uri = loc.get("artifactLocation", {}).get("uri", "(cross-skill)")
                  line = loc.get("region", {}).get("startLine")
                  where = f"`{uri}:{line}`" if line else f"`{uri}`"
                  print(f"| {r.get('level', 'note')} | `{r.get('ruleId', '?')}` | {where} |")

          log = Path("scan.log")
          if log.exists() and log.read_text(errors="replace").strip():
              print("\n<details><summary>Scanner output</summary>\n\n```")
              print(log.read_text(errors="replace").strip()[-8000:])
              print("```\n</details>")
          PY

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
        continue-on-error: true
