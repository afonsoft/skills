name: Skills.sh Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: skills.sh third-party security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run skills.sh security audit
        id: audit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: 'true'
        run: |
          python scripts/skills-sh-audit.py \
            skills/ \
            --fail-on high \
            --summary "$GITHUB_STEP_SUMMARY" || exit_code=$?

          # If the audit command fails, the step summary is already written.
          # Exit with the captured exit code so the job is red on high/critical findings.
          exit ${exit_code:-0}
