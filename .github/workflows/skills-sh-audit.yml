name: Skills.sh Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: skills.sh third-party security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run skills.sh security audit
        id: audit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: 'true'
        run: |
          # Report-only: the full per-skill table lands in the step summary
          # and findings surface as warning/notice annotations — the job
          # never goes red on audit results.
          python scripts/skills-sh-audit.py \
            skills/ \
            --fail-on none \
            --summary "$GITHUB_STEP_SUMMARY"
